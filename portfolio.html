<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポートフォリオ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f9f8f5;
    --border: #e4e2db;
    --text-primary: #1c1b18;
    --text-secondary: #5a5852;
    --text-muted: #9a9890;
    --accent: #2563eb;
    --accent-bg: #eff4ff;
    --accent-text: #1e40af;
    --radius: 12px;
    --font: 'Noto Sans JP', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .wrapper {
    max-width: 720px;
    margin: 0 auto;
  }

  /* ---- HEADER ---- */
  .site-header {
    text-align: center;
    margin-bottom: 3rem;
  }
  .site-header .eyebrow {
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: .5rem;
  }
  .site-header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .site-header .sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: .4rem;
  }
  .divider {
    width: 40px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
    margin: 1rem auto 0;
  }

  /* ---- CARD ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: fadeUp .4s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    padding: 1.5rem 1.75rem 1.25rem;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--accent-bg);
    color: var(--accent-text);
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: .5rem;
  }
  .card-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.01em;
    line-height: 1.3;
  }
  .card-date {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: .3rem;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .page-counter {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: .25rem;
  }

  /* ---- IMAGE ---- */
  .img-area {
    height: 200px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .img-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .img-placeholder {
    text-align: center;
    color: var(--text-muted);
  }
  .img-placeholder svg {
    width: 36px;
    height: 36px;
    margin-bottom: .5rem;
    opacity: .4;
  }
  .img-placeholder p {
    font-size: 12px;
  }

  /* ---- BODY ---- */
  .card-body {
    padding: 1.5rem 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: .6rem;
  }

  /* flowchart */
  .flow {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .flow-step {
    background: var(--accent-bg);
    border: 1px solid #bfdbfe;
    color: var(--accent-text);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .flow-arrow {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1;
  }

  /* desc */
  .desc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  /* tags */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* ---- NAV ---- */
  .nav {
    padding: 1rem 1.75rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
  }
  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font);
    font-size: 13px;
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .nav-btn:hover:not(:disabled) {
    background: var(--accent-bg);
    border-color: #bfdbfe;
    color: var(--accent-text);
  }
  .nav-btn:disabled {
    opacity: .35;
    cursor: default;
  }
  .dots {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background .2s, transform .2s;
    cursor: pointer;
  }
  .dot.active {
    background: var(--accent);
    transform: scale(1.4);
  }

  /* ---- FOOTER ---- */
  .site-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 12px;
    color: var(--text-muted);
  }

  @media (max-width: 480px) {
    .card-top { flex-direction: column; gap: .5rem; }
    .card-body { padding: 1.25rem; }
    .card-title { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <header class="site-header">
    <p class="eyebrow">Portfolio</p>
    <h1>作品集</h1>
    <p class="sub">Python・VBA・GASによる業務自動化ツール</p>
    <div class="divider"></div>
  </header>

  <div class="card" id="card">
    <div class="card-top">
      <div>
        <div class="badge" id="badge">● Python</div>
        <div class="card-title" id="title">作品タイトル</div>
        <div class="card-date" id="date">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="date-text">YYYY年MM月</span>
        </div>
      </div>
      <div class="page-counter" id="counter">1 / 10</div>
    </div>

    <div class="img-area" id="img-area">
      <div class="img-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <p>作品のスクリーンショット</p>
      </div>
    </div>

    <div class="card-body">
      <div>
        <div class="section-label">フローチャート</div>
        <div class="flow" id="flow"></div>
      </div>
      <div>
        <div class="section-label">説明</div>
        <div class="desc" id="desc"></div>
      </div>
      <div>
        <div class="section-label">使用言語・ツール</div>
        <div class="tags" id="tags"></div>
      </div>
    </div>

    <div class="nav">
      <button class="nav-btn" id="prev-btn" onclick="changePage(-1)">
        &#8592; 前へ
      </button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="next-btn" onclick="changePage(1)">
        次へ &#8594;
      </button>
    </div>
  </div>

  <footer class="site-footer">
    <p>データは portfolio.js の <code>PAGES</code> 配列を編集して更新できます</p>
  </footer>

</div>

<script>
/* ============================================================
   PAGES — ここを編集して作品データを追加してください
   画像を使う場合は image に画像ファイルのパスを指定してください
   例: image: 'images/work1.png'
   ============================================================ */
const PAGES = [
  {
    badge: 'Python',
    title: '月次レポート自動化ツール',
    date: '2025年04月',
    image: '',
    flow: ['Excelデータ読込', 'データ集計・加工', 'PDFレポート生成', 'メール自動送信'],
    desc: '毎月手作業で行っていたExcelデータの集計・PDF化・メール送信をPythonで完全自動化。作業時間を月5時間→15分に短縮。定型フォーマットへの対応、複数部署への自動配信も実現した。',
    tags: ['Python', 'openpyxl', 'reportlab', 'smtplib']
  },
  {
    badge: 'VBA',
    title: 'Excel請求書一括作成マクロ',
    date: '2025年02月',
    image: '',
    flow: ['顧客リスト読込', 'テンプレ複製', 'データ差込', 'PDF保存・出力'],
    desc: '顧客マスタとテンプレートから請求書を一括生成するVBAマクロ。月30件の請求書作成が約3分で完了。ファイル名の自動命名・フォルダ振り分けも対応し、ヒューマンエラーをゼロにした。',
    tags: ['VBA', 'Excel', 'PDF出力']
  },
  {
    badge: 'GAS',
    title: 'Googleフォーム自動集計システム',
    date: '2024年12月',
    image: '',
    flow: ['フォーム回答受信', 'スプレッドシート集計', 'グラフ自動更新', 'Slack通知送信'],
    desc: 'アンケートフォームの回答を自動集計し、グラフ付きのサマリーをSlackへ通知するGASシステム。集計の手作業をゼロにし、リアルタイムで結果を共有できる体制を構築した。',
    tags: ['GAS', 'Googleフォーム', 'スプレッドシート', 'Slack']
  },
  /* ---- 作品4〜10はここに追加 ---- */
  {
    badge: '作品4',
    title: '作品タイトル4',
    date: '2024年XX月',
    image: '',
    flow: ['ステップ1', 'ステップ2', 'ステップ3'],
    desc: 'ここに説明を入力してください。',
    tags: ['言語/ツール']
  },
  {
    badge: '作品5',
    title: '作品タイトル5',
    date: '2024年XX月',
    image: '',
    flow: ['ステップ1', 'ステップ2', 'ステップ3'],
    desc: 'ここに説明を入力してください。',
    tags: ['言語/ツール']
  },
  {
    badge: '作品6',
    title: '作品タイトル6',
    date: '2024年XX月',
    image: '',
    flow: ['ステップ1', 'ステップ2', 'ステップ3'],
    desc: 'ここに説明を入力してください。',
    tags: ['言語/ツール']
  },
  {
    badge: '作品7',
    title: '作品タイトル7',
    date: '2024年XX月',
    image: '',
    flow: ['ステップ1', 'ステップ2', 'ステップ3'],
    desc: 'ここに説明を入力してください。',
    tags: ['言語/ツール']
  },
  {
    badge: '作品8',
    title: '作品タイトル8',
    date: '2024年XX月',
    image: '',
    flow: ['ステップ1', 'ステップ2', 'ステップ3'],
    desc: 'ここに説明を入力してください。',
    tags: ['言語/ツール']
  },
  {
    badge: '作品9',
    title: '作品タイトル9',
    date: '2024年XX月',
    image: '',
    flow: ['ステップ1', 'ステップ2', 'ステップ3'],
    desc: 'ここに説明を入力してください。',
    tags: ['言語/ツール']
  },
  {
    badge: '作品10',
    title: '作品タイトル10',
    date: '2024年XX月',
    image: '',
    flow: ['ステップ1', 'ステップ2', 'ステップ3'],
    desc: 'ここに説明を入力してください。',
    tags: ['言語/ツール']
  },
];

/* ---- ここから下は編集不要 ---- */
let cur = 0;
const total = PAGES.length;

function buildDots() {
  const el = document.getElementById('dots');
  el.innerHTML = '';
  PAGES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === cur ? ' active' : '');
    d.onclick = () => { cur = i; render(); };
    el.appendChild(d);
  });
}

function render() {
  const p = PAGES[cur];
  const card = document.getElementById('card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'fadeUp .4s ease both';

  document.getElementById('badge').textContent = '● ' + p.badge;
  document.getElementById('title').textContent = p.title;
  document.getElementById('date-text').textContent = p.date;
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + total;
  document.getElementById('desc').textContent = p.desc;

  const imgArea = document.getElementById('img-area');
  if (p.image) {
    imgArea.innerHTML = '<img src="' + p.image + '" alt="' + p.title + '">';
  } else {
    imgArea.innerHTML = '<div class="img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><p>作品のスクリーンショット</p></div>';
  }

  const flow = document.getElementById('flow');
  flow.innerHTML = p.flow.map((s, i) =>
    '<span class="flow-step">' + s + '</span>' +
    (i < p.flow.length - 1 ? '<span class="flow-arrow">&#8594;</span>' : '')
  ).join('');

  const tags = document.getElementById('tags');
  tags.innerHTML = p.tags.map(t => '<span class="tag">' + t + '</span>').join('');

  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === total - 1;

  document.querySelectorAll('.dot').forEach((d, i) => {
    d.className = 'dot' + (i === cur ? ' active' : '');
  });
}

function changePage(dir) {
  if (cur + dir < 0 || cur + dir >= total) return;
  cur += dir;
  render();
}

buildDots();
render();
</script>
</body>
</html>
